<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snap</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard-header">
        <div>
          <h1 id="welcome">Hola</h1>
          <p id="email" class="muted"></p>
        </div>
        <button type="button" id="logout-btn" class="secondary-btn">Cerrar sesión</button>
      </header>

      <section class="stats-grid">
        <div class="stat-tile">
          <span class="stat-value" id="stat-account-clicks">0</span>
          <span class="stat-label">Clicks totales</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="stat-url-count">0</span>
          <span class="stat-label">URLs creadas</span>
        </div>
      </section>

      <section class="trend-section">
        <h2>Tendencia (últimos <span id="trend-range">30</span> días)</h2>
        <div class="trend-chart" id="trend-chart"></div>
      </section>

      <section class="create-section">
        <h2>Crear URL corta</h2>
        <form id="create-form" novalidate>
          <input
            id="original-url"
            name="url"
            type="url"
            aria-label="URL a acortar"
            placeholder="https://ejemplo.com/pagina"
            required
          />
          <button type="submit" id="create-btn">Acortar</button>
        </form>
        <p class="error-message" id="create-error"></p>
        <p class="success-message" id="create-success"></p>
      </section>

      <section class="urls-section">
        <h2>Tus URLs</h2>
        <p class="muted" id="urls-empty">Todavía no has creado ninguna URL.</p>
        <ul class="urls-list" id="urls-list"></ul>
      </section>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
